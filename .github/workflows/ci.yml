name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  content:
    name: Datos (pipeline y esquema)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pruebas de esquema y FTS5
        working-directory: tools/content_pipeline
        run: python -m unittest test_schema -v
      - name: El content.db de muestra está al día
        run: |
          python tools/content_pipeline/make_sample_db.py /tmp/content.db
          python - <<'EOF'
          import sqlite3
          def dump(p):
              c = sqlite3.connect(p)
              return sorted(c.execute("select id,text,text_norm,card_score from verses"))
          assert dump("/tmp/content.db") == dump("assets/db/content.db"), "regenerar assets/db/content.db"
          EOF

  pytest:
    name: Pipeline (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pruebas del pipeline si hay suite pytest
        run: |
          if [ -d tools/content_pipeline ] && ls tools/content_pipeline/test_*.py >/dev/null 2>&1; then
            pip install pytest
            if [ -f tools/content_pipeline/requirements.txt ]; then pip install -r tools/content_pipeline/requirements.txt; fi
            cd tools/content_pipeline && python -m pytest -q
          else
            echo "Sin pruebas de pytest todavia"
          fi

  app:
    name: Flutter (formato, analisis, pruebas, manifiesto)
    runs-on: ubuntu-latest
    needs: content
    steps:
      - uses: actions/checkout@v4
      - name: Leer la version de Flutter de .fvmrc
        id: fvm
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ steps.fvm.outputs.version }}
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze --fatal-infos
      - run: flutter test --coverage
      - name: Compilar APK de depuracion
        run: flutter build apk --debug
      - name: Permisos del manifiesto (principal y release)
        run: |
          flutter build apk --release
          python3 scripts/check_manifest.py
