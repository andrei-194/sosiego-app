<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="{{ L.bg }}" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="{{ D.bg }}" media="(prefers-color-scheme: dark)">
<title>{{ title }}</title>
<meta name="description" content="{{ description }}">
<link rel="canonical" href="{{ url }}">
{%- if noindex %}
<meta name="robots" content="noindex">
{%- endif %}
<meta property="og:type" content="website">
<meta property="og:site_name" content="Sosiego">
<meta property="og:locale" content="es_CO">
<meta property="og:title" content="{{ og_title }}">
<meta property="og:description" content="{{ description }}">
<meta property="og:url" content="{{ url }}">
<meta property="og:image" content="{{ site_url }}{{ base }}/assets/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Sosiego: una palabra para hoy">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="{{ og_title }}">
<meta name="twitter:description" content="{{ description }}">
<meta name="twitter:image" content="{{ site_url }}{{ base }}/assets/og.png">
<link rel="icon" href="data:,">
<link rel="preload" href="{{ base }}/assets/fonts/{{ preload_font }}" as="font" type="font/woff2" crossorigin>
<style>{{ css|safe }}</style>
</head>
<body>
<a class="skip" href="#contenido">Saltar al contenido</a>
<header><div class="wrap"><a class="brand" href="{{ base }}/">Sosiego</a></div></header>
<main id="contenido"><div class="wrap">
{% block main %}{% endblock %}
</div></main>
<footer><div class="wrap"><a href="{{ base }}/privacidad">Política de privacidad</a> · Sin cuentas, sin cookies, sin rastreo.</div></footer>
</body>
</html>
