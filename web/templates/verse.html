{% extends "base.html" %}
{% block main %}
<article class="card">
<p class="verse">«{{ text }}»</p>
<h1 class="ref">{{ ref }}</h1>
<p class="src">Reina-Valera 1909</p>
</article>
<div class="actions">
<a class="btn btn-main" href="{{ play_url }}" rel="noopener">Descargar en Google Play</a>
<a class="btn btn-alt" href="{{ next_url }}" rel="next">{{ next_label }}</a>
</div>
{% endblock %}
